# Runs the same checks as `make check` (typecheck, lint, tests) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/agent-worker/uv.lock

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd services/agent-worker && uv sync --frozen

      - name: Typecheck, lint and test
        run: make check
