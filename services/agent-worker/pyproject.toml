[project]
name = "agent-worker"
version = "0.1.0"
description = "MetaAvatar agent worker: LiveKit Agents + Gemini Live"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents[google,silero]>=1.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_worker"]

[tool.ruff]
line-length = 110
extend-exclude = ["agent_worker/protocol_models.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
