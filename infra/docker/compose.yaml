# Local dev stack. LiveKit runs in --dev mode (keys devkey/secret), never expose it publicly.
name: metaavatar
services:
  livekit:
    image: livekit/livekit-server:v1.12
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"          # signalling (ws)
      - "7881:7881"          # WebRTC over TCP
      - "50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_CONFIG: |
        rtc:
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: 127.0.0.1
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: metaavatar
      POSTGRES_PASSWORD: metaavatar
      POSTGRES_DB: metaavatar
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    profiles: ["full"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    profiles: ["full"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: metaavatar
      MINIO_ROOT_PASSWORD: metaavatar-dev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./data/minio:/data"]
    profiles: ["full"]
