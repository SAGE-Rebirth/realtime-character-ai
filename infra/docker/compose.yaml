# Local stack. LiveKit runs in --dev mode (keys devkey/secret), never expose it publicly.
#
#   make start    LiveKit and Postgres here; API, worker and Studio as local processes
#   make docker   everything in containers: LiveKit, Postgres, API, worker, Studio  (profile "app")
#
# Where the data is: accounts, agents, documents and memory are in Postgres (its files are under
# infra/docker/data/postgres). Avatar models are files under ./assets/avatars. Both ways of running
# use the same database and the same avatar folder, so they share the same data.
# Redis and MinIO (profile "full") are placeholders for later phases; nothing uses them yet.
name: metaavatar
services:
  livekit:
    image: livekit/livekit-server:v1.12
    command: --dev --bind 0.0.0.0
    ports:
      # Published on this machine only: the dev keys are public knowledge.
      - "127.0.0.1:7880:7880"          # signalling (ws)
      - "127.0.0.1:7881:7881"          # WebRTC over TCP
      - "127.0.0.1:50000-50100:50000-50100/udp"
    environment:
      LIVEKIT_CONFIG: |
        rtc:
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
          node_ip: 127.0.0.1
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      # Development credentials. The port is published on this machine only; change both the
      # password and DATABASE_URL before running this anywhere else.
      POSTGRES_USER: metaavatar
      POSTGRES_PASSWORD: metaavatar
      POSTGRES_DB: metaavatar
    # 5433 on this machine, so it doesn't clash with a Postgres you may already run on 5432.
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaavatar -d metaavatar"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ../.., dockerfile: infra/docker/api.Dockerfile }
    profiles: ["app"]
    env_file: [{ path: ../../.env, required: false }]
    environment:
      API_PORT: "8787"
      API_HOST: 0.0.0.0   # inside the container; the port below is published on this machine only
      # Addresses as the browser sees them.
      API_PUBLIC_URL: http://localhost:8787
      LIVEKIT_URL: ws://localhost:7880
      STUDIO_ORIGIN: http://localhost:3100
      DATA_DIR: /app/data
      AVATAR_DIR: /app/assets/avatars
      DATABASE_URL: postgres://metaavatar:metaavatar@postgres:5432/metaavatar
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ../../data:/app/data
      - ../../assets/avatars:/app/assets/avatars
    restart: unless-stopped

  worker:
    build: { context: ../.., dockerfile: infra/docker/worker.Dockerfile }
    profiles: ["app"]
    env_file: [{ path: ../../.env, required: false }]
    environment:
      # LiveKit tells peers to send media to 127.0.0.1 (see node_ip above), which is right for a
      # browser on this machine. The worker shares LiveKit's network so that address reaches it too.
      LIVEKIT_URL: ws://127.0.0.1:7880
      PLATFORM_API_URL: http://api:8787
    network_mode: "service:livekit"
    depends_on:
      livekit: { condition: service_started }
      api: { condition: service_healthy }
    restart: unless-stopped

  studio:
    build:
      context: ../..
      dockerfile: infra/docker/studio.Dockerfile
      args: { NEXT_PUBLIC_API_URL: http://localhost:8787 }
    profiles: ["app"]
    ports: ["127.0.0.1:3100:3100"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    profiles: ["full"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: metaavatar
      MINIO_ROOT_PASSWORD: metaavatar-dev
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["./data/minio:/data"]
    profiles: ["full"]
